services:
  # Database Service (PostgreSQL 14)
  postgres:
    image: postgres:14-alpine
    container_name: azatech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: azatech_order
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d azatech_order"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Service (Laravel 13 API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: azatech_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Azatech Order Management"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "base64:RxtR2EtBbRYIGCKPkP/IzQI0NFz5FverqRfTSgDy7JM="
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: azatech_order
      DB_USERNAME: postgres
      DB_PASSWORD: password123
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend Service (Next.js 16)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: azatech_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
